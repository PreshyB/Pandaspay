version: '3.8'

services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: pandaspay
      POSTGRES_PASSWORD: pandaspay
      POSTGRES_DB: pandaspay
    ports:
      - '5432:5432'
    volumes:
      - pandaspay_pg_data:/var/lib/postgresql/data

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    ports:
      - '6379:6379'

volumes:
  pandaspay_pg_data:
