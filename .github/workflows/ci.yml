name: CI

on:
  push:
    branches: [main, web-redesign-buybridge]
  pull_request:

jobs:
  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: pandaspay
          POSTGRES_PASSWORD: pandaspay
          POSTGRES_DB: pandaspay
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U pandaspay"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
      redis:
        image: redis:7
        ports: ['6379:6379']
    env:
      DB_HOST: localhost
      DB_PORT: '5432'
      DB_USERNAME: pandaspay
      DB_PASSWORD: pandaspay
      DB_NAME: pandaspay
      DB_SYNCHRONIZE: 'true'
      REDIS_URL: redis://localhost:6379
      AUTH_SECRET: ci-only-secret
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: backend/package-lock.json
      - run: npm ci
      - run: npm run build
      - run: npm test
      - run: npm run test:e2e -- --runInBand

  web:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
      - run: npm run build
